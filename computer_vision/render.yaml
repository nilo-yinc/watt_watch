services:
  - type: web
    name: watt-watch-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: RUN_CV
        value: "1"
      - key: WW_DUMMY_CAMERA
        value: "1"
      - key: WW_PUSH_TO_NODE
        value: "1"
      - key: WW_NODE_API_URL
        value: "https://watt-watch-node.onrender.com"
      - key: WW_SHOW_WINDOW
        value: "0"
      - key: WW_GHOST_PUSH_INTERVAL_S
        value: "2.0"
